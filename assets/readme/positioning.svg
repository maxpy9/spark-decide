<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Come si posiziona Spark-Decide su typed decisions">
<title>Come si posiziona Spark-Decide su typed decisions</title>
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .t1{fill:#eaf6ef} .t2{fill:#a3b8ad} .t3{fill:#6f8479} .g{fill:#2ee88a}
  .b{font-weight:700} .sb{font-weight:600}
  .cap{letter-spacing:.12em;font-size:11px;font-weight:700}
</style>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1411"/><stop offset="1" stop-color="#0a0f0d"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#16211c"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>
<rect x="0.5" y="0.5" width="899" height="329" rx="18" fill="url(#bgGrad)" stroke="#1f2d26"/>
<rect x="0.5" y="0.5" width="899" height="329" rx="18" fill="url(#dots)" opacity=".7"/>

<text x="20" y="36" class="s b t1" font-size="17">Typed decisions</text>
<text x="20" y="56" class="s t3" font-size="12">Accuratezza e qualità delle probabilità (KL dal gold, ECE)</text><text x="20" y="127" class="s t2" font-size="13">Spark-X2.5-4B (base)</text><text x="20" y="167" class="s t2" font-size="13">Rizzo Flow 4B Q8_0</text><text x="20" y="207" class="s t2" font-size="13">TypeSafe Jev 1.13*</text><text x="20" y="247" class="s g b" font-size="13">Spark-Decide**</text><text x="188.0" y="88" class="s cap t1">ACCURACY</text><text x="405.33333333333337" y="88" class="s t3" font-size="11" text-anchor="end">più alto è meglio ↑</text><line x1="188.0" y1="104" x2="188.0" y2="260" stroke="#1b2721"/><rect x="188.0" y="114" width="91.5" height="16" rx="4" fill="#33453c"/><text x="287.5" y="127" class="m t2" font-size="12">0,574</text><rect x="188.0" y="154" width="103.2" height="16" rx="4" fill="#33453c"/><text x="299.2" y="167" class="m t2" font-size="12">0,648</text><rect x="188.0" y="194" width="115.8" height="16" rx="4" fill="#33453c"/><text x="311.8" y="207" class="m t2" font-size="12">0,727</text><rect x="188.0" y="234" width="122.7" height="16" rx="4" fill="#2ee88a" filter="url(#glow)"/><text x="318.7" y="247" class="m t1 b" font-size="12">0,770</text><text x="425.33333333333337" y="88" class="s cap t1">KL DAL GOLD</text><text x="642.6666666666667" y="88" class="s t3" font-size="11" text-anchor="end">più basso è meglio ↓</text><line x1="425.33333333333337" y1="104" x2="425.33333333333337" y2="260" stroke="#1b2721"/><rect x="425.33333333333337" y="114" width="154.0" height="16" rx="4" fill="#33453c"/><text x="587.3" y="127" class="m t2" font-size="12">2,899</text><rect x="425.33333333333337" y="154" width="24.0" height="16" rx="4" fill="#33453c"/><text x="457.3" y="167" class="m t2" font-size="12">0,452</text><rect x="425.33333333333337" y="194" width="76.6" height="16" rx="4" fill="#33453c"/><text x="509.9" y="207" class="m t2" font-size="12">1,442</text><rect x="425.33333333333337" y="234" width="4.9" height="16" rx="4" fill="#2ee88a" filter="url(#glow)"/><text x="438.3" y="247" class="m t1 b" font-size="12">0,093</text><text x="662.6666666666667" y="88" class="s cap t1">ECE</text><text x="880.0000000000001" y="88" class="s t3" font-size="11" text-anchor="end">più basso è meglio ↓</text><line x1="662.6666666666667" y1="104" x2="662.6666666666667" y2="260" stroke="#1b2721"/><rect x="662.6666666666667" y="114" width="139.0" height="16" rx="4" fill="#33453c"/><text x="809.7" y="127" class="m t2" font-size="12">0,349</text><rect x="662.6666666666667" y="154" width="44.6" height="16" rx="4" fill="#33453c"/><text x="715.3" y="167" class="m t2" font-size="12">0,112</text><text x="668.6666666666667" y="207" class="m t3" font-size="12">n/d</text><rect x="662.6666666666667" y="234" width="52.6" height="16" rx="4" fill="#2ee88a" filter="url(#glow)"/><text x="723.2" y="247" class="m t1 b" font-size="12">0,132</text>
<line x1="20" y1="268" x2="880" y2="268" stroke="#1b2721"/>
<text x="20" y="288" class="s t3" font-size="11">Base, Rizzo Flow e Jev: model card di rizzoaiacademy/rizzo-flow, test LocalLLaMA/typed-decisions (400 casi, 2.000 decisioni). * dalla dataset card, non rimisurato.</text>
<text x="20" y="306" class="s t3" font-size="11">** valori dichiarati in models/spark-decide/README.txt («Test typed-decisions»), non ancora rimisurati sullo stesso harness.</text>
