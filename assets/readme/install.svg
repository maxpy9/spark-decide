<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Installazione con SparkDecide_Setup.exe in cinque passi">
<title>Installazione con SparkDecide_Setup.exe in cinque passi</title>
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .t1{fill:#eaf6ef} .t2{fill:#a3b8ad} .t3{fill:#6f8479} .g{fill:#2ee88a}
  .b{font-weight:700} .sb{font-weight:600}
  .cap{letter-spacing:.12em;font-size:11px;font-weight:700}

  .prog{transform-box:fill-box;transform-origin:left center;animation:prog 3.2s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes prog{0%{transform:scaleX(0)}75%,100%{transform:scaleX(1)}}
  .dot{animation:dot 3.2s ease-out infinite}
  @keyframes dot{0%,10%{fill:#0d1411}30%,100%{fill:#12241b}}
  @media (prefers-reduced-motion:reduce){.prog,.dot{animation:none}}
</style>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1411"/><stop offset="1" stop-color="#0a0f0d"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#16211c"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>
<rect x="0.5" y="0.5" width="899" height="209" rx="18" fill="url(#bgGrad)" stroke="#1f2d26"/>
<rect x="0.5" y="0.5" width="899" height="209" rx="18" fill="url(#dots)" opacity=".7"/>

<text x="20" y="34" class="s b t1" font-size="17">SparkDecide_Setup.exe · un clic, cinque passi</text>
<rect x="40" y="62" width="820" height="4" rx="2" fill="#13201a"/>
<rect class="prog" x="40" y="62" width="820" height="4" rx="2" fill="#2ee88a" filter="url(#glow)"/>
<circle cx="106.0" cy="64" r="16" fill="#0d1411" stroke="#2ee88a" stroke-width="2" class="dot" style="animation-delay:0.00s"/>
<text x="106.0" y="69" class="s b g" font-size="14" text-anchor="middle">1</text>
<text x="106.0" y="112" class="s b t1" font-size="15" text-anchor="middle">Script</text>
<text x="106.0" y="132" class="m t2" font-size="12" text-anchor="middle">da GitHub</text>
<text x="106.0" y="152" class="s t3" font-size="11.5" text-anchor="middle">maxpy9/spark-decide</text>
<circle cx="278.0" cy="64" r="16" fill="#0d1411" stroke="#2ee88a" stroke-width="2" class="dot" style="animation-delay:0.55s"/>
<text x="278.0" y="69" class="s b g" font-size="14" text-anchor="middle">2</text>
<text x="278.0" y="112" class="s b t1" font-size="15" text-anchor="middle">Python 3.11</text>
<text x="278.0" y="132" class="m t2" font-size="12" text-anchor="middle">+ .venv</text>
<text x="278.0" y="152" class="s t3" font-size="11.5" text-anchor="middle">installato se manca</text>
<circle cx="450.0" cy="64" r="16" fill="#0d1411" stroke="#2ee88a" stroke-width="2" class="dot" style="animation-delay:1.10s"/>
<text x="450.0" y="69" class="s b g" font-size="14" text-anchor="middle">3</text>
<text x="450.0" y="112" class="s b t1" font-size="15" text-anchor="middle">PyTorch</text>
<text x="450.0" y="132" class="m t2" font-size="12" text-anchor="middle">CUDA 12.4</text>
<text x="450.0" y="152" class="s t3" font-size="11.5" text-anchor="middle">+ transformers, peft, bnb</text>
<circle cx="622.0" cy="64" r="16" fill="#0d1411" stroke="#2ee88a" stroke-width="2" class="dot" style="animation-delay:1.65s"/>
<text x="622.0" y="69" class="s b g" font-size="14" text-anchor="middle">4</text>
<text x="622.0" y="112" class="s b t1" font-size="15" text-anchor="middle">Modelli</text>
<text x="622.0" y="132" class="m t2" font-size="12" text-anchor="middle">LoRA + Rizzo Flow</text>
<text x="622.0" y="152" class="s t3" font-size="11.5" text-anchor="middle">GitHub + HuggingFace</text>
<circle cx="794.0" cy="64" r="16" fill="#0d1411" stroke="#2ee88a" stroke-width="2" class="dot" style="animation-delay:2.20s"/>
<text x="794.0" y="69" class="s b g" font-size="14" text-anchor="middle">5</text>
<text x="794.0" y="112" class="s b t1" font-size="15" text-anchor="middle">Studio</text>
<text x="794.0" y="132" class="m t2" font-size="12" text-anchor="middle">127.0.0.1:7860</text>
<text x="794.0" y="152" class="s t3" font-size="11.5" text-anchor="middle">si apre nel browser</text><text x="20" y="190" class="s t3" font-size="11.5">Rilanciarlo è sicuro: ogni passo controlla cosa c'è già e scarica solo quello che manca.</text>
</svg>
