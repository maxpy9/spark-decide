<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Spark-Decide: decisioni tipizzate in un solo forward pass">
<title>Spark-Decide: decisioni tipizzate in un solo forward pass</title>
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .t1{fill:#eaf6ef} .t2{fill:#a3b8ad} .t3{fill:#6f8479} .g{fill:#2ee88a}
  .b{font-weight:700} .sb{font-weight:600}
  .cap{letter-spacing:.12em;font-size:11px;font-weight:700}

  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.8,.2,1)}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.grow,.pulse{animation:none}}
</style>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1411"/><stop offset="1" stop-color="#0a0f0d"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#16211c"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>
<rect x="0.5" y="0.5" width="899" height="359" rx="18" fill="url(#bgGrad)" stroke="#1f2d26"/>
<rect x="0.5" y="0.5" width="899" height="359" rx="18" fill="url(#dots)" opacity=".7"/>

<ellipse cx="120" cy="120" rx="150" ry="120" fill="#2ee88a" opacity=".10" filter="url(#softglow)"/>
<ellipse cx="760" cy="300" rx="180" ry="90" fill="#2ee88a" opacity=".05" filter="url(#softglow)"/>
<clipPath id="logoClip"><rect x="40" y="40" width="112" height="112" rx="22"/></clipPath>
<image x="40" y="40" width="112" height="112" clip-path="url(#logoClip)" href="data:image/jpeg;base64,"/>
<rect x="40" y="40" width="112" height="112" rx="22" fill="none" stroke="#2ee88a" stroke-opacity=".45"/>

<text x="176" y="92" class="s b t1" font-size="44">Spark<tspan class="g">-</tspan>Decide</text>
<text x="178" y="124" class="s t2" font-size="17">Decisioni tipizzate in un solo forward pass</text>
<g transform="translate(178,138)">
  <rect width="150" height="22" rx="11" fill="#12201a" stroke="#1c7c54"/>
  <text x="75" y="15" class="m g" font-size="11" text-anchor="middle">built on Rizzo Flow 4B</text>
</g>

<text x="40" y="200" class="s t1" font-size="15">Dai uno <tspan class="m g">STATE</tspan> (testo o JSON) e N domande:</text>
<text x="40" y="222" class="s t2" font-size="15">ottieni per ognuna risposta, confidenza e probabilità</text>
<text x="40" y="244" class="s t2" font-size="15">calibrate. Nessun token generato: legge i logit.</text>

<g transform="translate(40,272)">
  <rect width="86" height="30" rx="8" fill="#121c17" stroke="#1f2d26"/><text x="43" y="20" class="m t1" font-size="13" text-anchor="middle">choice</text>
  <rect x="96" width="92" height="30" rx="8" fill="#121c17" stroke="#1f2d26"/><text x="142" y="20" class="m t1" font-size="13" text-anchor="middle">boolean</text>
  <rect x="198" width="74" height="30" rx="8" fill="#121c17" stroke="#1f2d26"/><text x="235" y="20" class="m t1" font-size="13" text-anchor="middle">score</text>
  <text x="290" y="20" class="s g b" font-size="16">→</text>
  <text x="314" y="20" class="m t2" font-size="12">risposta + probabilità</text>
</g>

<rect x="588" y="40" width="278" height="268" rx="14" fill="#0b120f" stroke="#1f2d26"/>
<circle cx="608" cy="62" r="4" fill="#2ee88a" class="pulse"/>
<text x="620" y="66" class="s cap t3">ESEMPIO · SNAKE 10×10</text>
<text x="606" y="94" class="m t2" font-size="12">detailed_traces.json · passo 1</text>
<text x="606" y="118" class="m t1 sb" font-size="13">move <tspan class="t3">· choice</tspan></text>

  <text x="606" y="143" class="m g b" font-size="12">right</text>
  <rect x="654" y="133" width="150" height="12" rx="6" fill="#121c17"/>
  <rect class="grow" x="654" y="133" width="149.3" height="12" rx="6" fill="#2ee88a" filter="url(#glow)"/>
  <text x="848" y="143" class="m t1 b" font-size="12" text-anchor="end">99,5%</text>
  <text x="606" y="173" class="m t2" font-size="12">left</text>
  <rect x="654" y="163" width="150" height="12" rx="6" fill="#121c17"/>
  <rect class="grow" x="654" y="163" width="3.0" height="12" rx="6" fill="#33453c"/>
  <text x="848" y="173" class="m t3" font-size="12" text-anchor="end">0,2%</text>
  <text x="606" y="203" class="m t2" font-size="12">down</text>
  <rect x="654" y="193" width="150" height="12" rx="6" fill="#121c17"/>
  <rect class="grow" x="654" y="193" width="3.0" height="12" rx="6" fill="#33453c"/>
  <text x="848" y="203" class="m t3" font-size="12" text-anchor="end">0,1%</text>
  <text x="606" y="233" class="m t2" font-size="12">up</text>
  <rect x="654" y="223" width="150" height="12" rx="6" fill="#121c17"/>
  <rect class="grow" x="654" y="223" width="3.0" height="12" rx="6" fill="#33453c"/>
  <text x="848" y="233" class="m t3" font-size="12" text-anchor="end">0,1%</text>
<line x1="606" y1="266" x2="848" y2="266" stroke="#1b2721"/>
<text x="606" y="294" class="m t1 sb" font-size="12">danger <tspan class="t3">· boolean</tspan></text>
<text x="848" y="294" class="m t2" font-size="12" text-anchor="end">false · p=0,04</text>

</svg>
